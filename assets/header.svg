<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Ricardo Mangabeiro - Desenvolvedor Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07050f"/>
      <stop offset="0.7" stop-color="#140b2e"/>
      <stop offset="1" stop-color="#2a0f3d"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="200" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#00f0ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-800 0;0 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowA">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="floorMask">
      <rect x="0" y="232" width="1200" height="88" fill="url(#floorFade)"/>
    </mask>

    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- recortes da digitação: cada frase aparece em 1/4 do ciclo de 16s -->
    <clipPath id="t0"><rect x="506" y="160" height="40" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;346;346;0;0" keyTimes="0;0.08;0.2;0.25;1"/></rect></clipPath>
    <clipPath id="t1"><rect x="506" y="160" height="40" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;317;317;0;0" keyTimes="0;0.25;0.33;0.45;0.5;1"/></rect></clipPath>
    <clipPath id="t2"><rect x="506" y="160" height="40" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;303;303;0;0" keyTimes="0;0.5;0.58;0.7;0.75;1"/></rect></clipPath>
    <clipPath id="t3"><rect x="506" y="160" height="40" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;274;274;0" keyTimes="0;0.75;0.83;0.95;1"/></rect></clipPath>

    <clipPath id="sliceA"><rect x="0" y="70" width="1200" height="10"><animate attributeName="y" dur="3.7s" repeatCount="indefinite" values="70;118;84;132;70" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete"/></rect></clipPath>
    <clipPath id="sliceB"><rect x="0" y="100" width="1200" height="7"><animate attributeName="y" dur="2.9s" repeatCount="indefinite" values="124;78;110;92;124" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .name { font-family: 'Segoe UI Black', 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 64px; letter-spacing: 6px; }
    .glitch-c, .glitch-m, .slice { opacity: 0; }
    .glitch-c { animation: gc 4s infinite steps(1); }
    .glitch-m { animation: gm 4s infinite steps(1); }
    .slice { animation: sl 3.3s infinite steps(1); }
    .float { animation: fl 9s ease-in-out infinite alternate; }
    .float2 { animation: fl2 11s ease-in-out infinite alternate; }
    .scan { animation: scan 6s linear infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes gc { 0%,86%,100% { transform: translate(0,0); opacity: 0; } 87% { transform: translate(-6px,2px); opacity: .9; } 90% { transform: translate(4px,-1px); opacity: .9; } 93% { transform: translate(-2px,0); opacity: .8; } }
    @keyframes gm { 0%,86%,100% { transform: translate(0,0); opacity: 0; } 88% { transform: translate(6px,-2px); opacity: .9; } 91% { transform: translate(-4px,1px); opacity: .9; } 94% { transform: translate(2px,0); opacity: .8; } }
    @keyframes sl { 0%,70%,100% { transform: translateX(0); opacity: 0; } 72% { transform: translateX(18px); opacity: 1; } 75% { transform: translateX(-12px); opacity: 1; } 78% { transform: translateX(6px); opacity: 1; } }
    @keyframes fl { from { transform: translate(-60px,10px); } to { transform: translate(80px,-20px); } }
    @keyframes fl2 { from { transform: translate(70px,-10px); } to { transform: translate(-90px,15px); } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(330px); } }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- fundo -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <ellipse class="float" cx="330" cy="120" rx="320" ry="140" fill="url(#glowA)"/>
  <ellipse class="float2" cx="880" cy="150" rx="300" ry="130" fill="url(#glowB)"/>

  <!-- estrelas -->
  <g fill="#ffffff">
    <circle class="tw" cx="80" cy="40" r="1.4"/>
    <circle class="tw" cx="190" cy="200" r="1" style="animation-delay:.6s"/>
    <circle class="tw" cx="260" cy="30" r="1.2" style="animation-delay:1.3s"/>
    <circle class="tw" cx="420" cy="60" r="1" style="animation-delay:2s"/>
    <circle class="tw" cx="560" cy="25" r="1.5" style="animation-delay:.3s"/>
    <circle class="tw" cx="700" cy="50" r="1" style="animation-delay:1.7s"/>
    <circle class="tw" cx="830" cy="30" r="1.3" style="animation-delay:.9s"/>
    <circle class="tw" cx="960" cy="70" r="1" style="animation-delay:2.4s"/>
    <circle class="tw" cx="1060" cy="35" r="1.5" style="animation-delay:1.1s"/>
    <circle class="tw" cx="1140" cy="190" r="1.1" style="animation-delay:.4s"/>
    <circle class="tw" cx="40" cy="170" r="1.2" style="animation-delay:2.1s"/>
    <circle class="tw" cx="1010" cy="200" r="1" style="animation-delay:1.5s"/>
  </g>

  <!-- piso em grade (synthwave) -->
  <g mask="url(#floorMask)" stroke="#ff2bd6" stroke-width="1.2" opacity="0.7">
    <line x1="600" y1="232" x2="-1000" y2="320"/>
    <line x1="600" y1="232" x2="-600" y2="320"/>
    <line x1="600" y1="232" x2="-250" y2="320"/>
    <line x1="600" y1="232" x2="50" y2="320"/>
    <line x1="600" y1="232" x2="330" y2="320"/>
    <line x1="600" y1="232" x2="600" y2="320"/>
    <line x1="600" y1="232" x2="870" y2="320"/>
    <line x1="600" y1="232" x2="1150" y2="320"/>
    <line x1="600" y1="232" x2="1450" y2="320"/>
    <line x1="600" y1="232" x2="1800" y2="320"/>
    <line x1="600" y1="232" x2="2200" y2="320"/>
    <g>
      <line x1="0" x2="1200" y1="232" y2="232"><animate attributeName="y1" values="234;320" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 1 1"/><animate attributeName="y2" values="234;320" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 1 1"/></line>
      <line x1="0" x2="1200" y1="232" y2="232"><animate attributeName="y1" values="234;320" dur="3s" begin="-0.75s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 1 1"/><animate attributeName="y2" values="234;320" dur="3s" begin="-0.75s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 1 1"/></line>
      <line x1="0" x2="1200" y1="232" y2="232"><animate attributeName="y1" values="234;320" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 1 1"/><animate attributeName="y2" values="234;320" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 1 1"/></line>
      <line x1="0" x2="1200" y1="232" y2="232"><animate attributeName="y1" values="234;320" dur="3s" begin="-2.25s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 1 1"/><animate attributeName="y2" values="234;320" dur="3s" begin="-2.25s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 1 1"/></line>
    </g>
  </g>
  <line x1="0" y1="232" x2="1200" y2="232" stroke="#ff2bd6" stroke-width="2" filter="url(#neon)" opacity="0.9"/>

  <!-- nome com glitch -->
  <g text-anchor="middle">
    <text class="name glitch-c" x="600" y="125" fill="#00f0ff">RICARDO MANGABEIRO</text>
    <text class="name glitch-m" x="600" y="125" fill="#ff2bd6">RICARDO MANGABEIRO</text>
    <text class="name" x="600" y="125" fill="url(#nameGrad)" filter="url(#neon)">RICARDO MANGABEIRO</text>
    <g clip-path="url(#sliceA)"><text class="name slice" x="600" y="125" fill="#ffffff">RICARDO MANGABEIRO</text></g>
    <g clip-path="url(#sliceB)"><text class="name slice" x="600" y="125" fill="#00f0ff" style="animation-delay:-1.4s">RICARDO MANGABEIRO</text></g>
  </g>

  <!-- linha de terminal com digitação -->
  <g class="mono" font-size="24">
    <text x="348" y="188" fill="#39ff88">~/rmvnew</text>
    <text x="477" y="188" fill="#8b949e">$</text>
    <g fill="#e6edf3">
      <text x="506" y="188" clip-path="url(#t0)" textLength="346" lengthAdjust="spacingAndGlyphs">desenvolvedor full stack</text>
      <text x="506" y="188" clip-path="url(#t1)" textLength="317" lengthAdjust="spacingAndGlyphs">apis com nestjs + node</text>
      <text x="506" y="188" clip-path="url(#t2)" textLength="303" lengthAdjust="spacingAndGlyphs">java · spring · kotlin</text>
      <text x="506" y="188" clip-path="url(#t3)" textLength="274" lengthAdjust="spacingAndGlyphs">interfaces em react</text>
    </g>
    <rect class="blink" x="508" y="168" width="13" height="26" fill="#00f0ff">
      <animate attributeName="x" dur="16s" repeatCount="indefinite"
        values="508;854;854;508;825;825;508;811;811;508;782;782;508"
        keyTimes="0;0.08;0.2;0.25;0.33;0.45;0.5;0.58;0.7;0.75;0.83;0.95;1"/>
    </rect>
  </g>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="1200" height="30" fill="#ffffff" opacity="0.035"/>
</svg>
